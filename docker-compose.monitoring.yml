# 로컬 모니터링 (선택적): Prometheus + Grafana
# 평소에는 끄고, 성능 분석 필요 시에만 기동
# 실행: docker compose -f docker-compose.monitoring.yml up -d
# 종료: docker compose -f docker-compose.monitoring.yml down

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: sportsify-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=1w"
      - "--storage.tsdb.retention.size=10GB"
      - "--storage.tsdb.wal-compression"
      - "--query.max-concurrency=5"
      - "--query.max-samples=5000000"
      - "--web.enable-remote-write-receiver"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  grafana-image-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: sportsify-grafana-renderer
    environment:
      ENABLE_METRICS: "true"
      HTTP_PORT: 8081
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    container_name: sportsify-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_RENDERING_SERVER_URL: "http://grafana-image-renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
      GF_LOG_FILTERS: "rendering:debug"
      GF_INSTALL_PLUGINS: redis-datasource
      REDIS_GRAFANA_URL: redis://host.docker.internal:6379
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
      - grafana-image-renderer
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: sportsify-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://sportsify:sportsify@host.docker.internal:5432/sportsify?sslmode=disable
    command:
      - "--extend.query-path=/etc/postgres_exporter/queries.yaml"
    volumes:
      - ./monitoring/postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    ports:
      - "9187:9187"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

volumes:
  prometheus_data:
  grafana_data:

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
#      leak-detection-threshold: 60000
      connection-timeout: 5000


  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

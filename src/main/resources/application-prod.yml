server:
  port: 8080
  forward-headers-strategy: framework

spring:
  config:
    import:
      - classpath:notification.yml
      - classpath:database.yml
      - classpath:monitoring.yml
      - classpath:oauth.yml
      - classpath:payment.yml

  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    com.sportsify: INFO
    org.springframework.security: WARN

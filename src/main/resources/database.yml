spring:
  datasource:
    hikari:
      maximum-pool-size: 200
      minimum-idle: 20
      leak-detection-threshold: 60000
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed

  jpa:
    hibernate:
      ddl-auto: validate
      #show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        #format_sql: true
    open-in-view: false

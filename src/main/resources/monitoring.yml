
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, threaddump, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: sportsify
    distribution:
      percentiles:
        "[http.server.requests]": 0.5, 0.95, 0.99
        "[sse.send.duration]": 0.5, 0.95, 0.99
      slo:
        "[http.server.requests]":
          - 50ms
          - 100ms
          - 200ms
          - 500ms
    enable:
      tomcat: true
      jvm: true
      process: true


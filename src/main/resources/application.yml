server:
  http2:
    enabled: true
  tomcat:
    max-connections: 20000
    accept-count: 1000
    keep-alive-timeout: 90s
    connection-timeout: 30s
    mbeanregistry:
      enabled: true

spring:
  application:
    name: sportsify

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 10s

  jackson:
    time-zone: UTC
    datatype:
      datetime:
        write-dates-as-timestamps: false


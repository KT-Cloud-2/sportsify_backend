# 로컬 개발용 인프라 (postgres + redis + app)
# 실행:  docker compose -f docker-compose.local.yml up -d
# 종료:  docker compose -f docker-compose.local.yml down
# app 빌드 포함: docker compose -f docker-compose.local.yml up -d --build
#
# [postgres 스키마 초기화]
# 1) 볼륨 포함 전체 삭제 후 재기동 (Flyway가 마이그레이션 재실행)
#    docker compose -f docker-compose.local.yml down -v
#    docker compose -f docker-compose.local.yml up -d
#
# 2) DB만 DROP & CREATE 후 재기동
#    docker exec -it sportsify-postgres psql -U sportsify -c "DROP DATABASE sportsify;"
#    docker exec -it sportsify-postgres psql -U sportsify -c "CREATE DATABASE sportsify;"
#
# 주의! grafana에서 query duration 측정을 위해 해당 table을 생성해야함
# docker exec -it sportsify-postgres psql -U sportsify -d sportsify -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
# 이는 처음 실행에서만 추가하면 됨

services:
  sysctl-init:
    image: alpine:latest
    container_name: sysctl-init
    privileged: true
    command: sysctl -w fs.file-max=2097152
    restart: "no"
  postgres:
    image: postgres:18
    container_name: sportsify-postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-sportsify}
      POSTGRES_USER: ${DB_USERNAME:-sportsify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sportsify}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c max_connections=300
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    container_name: sportsify-redis
    # redis.conf 공식 기본값 기준 (https://raw.githubusercontent.com/redis/redis/8.0/redis.conf)
    # M2 Air 로컬 개발 기준: 영속성 비활성화, 메모리 상한 256m, LRU 축출
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --hz 10
      --loglevel warning
      --databases 1
      --tcp-keepalive 300
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportsify-app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_NAME: ${DB_NAME:-sportsify}
      DB_USERNAME: ${DB_USERNAME:-sportsify}
      DB_PASSWORD: ${DB_PASSWORD:-sportsify}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-sportsify}
      SPRING_DATA_REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxMetaspaceSize=256m
        -XX:MaxRAMPercentage=80.0
        -XX:SoftMaxHeapSize=2G
        -XX:ZCollectionInterval=5
        -XX:+UseZGC
    ports:
      - "8080:8080"
    depends_on:
      sysctl-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 4G

volumes:
  postgres_data:
  redis_data:

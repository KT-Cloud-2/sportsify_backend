global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: sportsify-app
    metrics_path: /actuator/prometheus
    scheme: http
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
